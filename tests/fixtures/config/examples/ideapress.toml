# IdeaPress configuration.
# Every key below is optional; a fresh install with no file at all is fully functional and starts
# with no backend reachable.
# Precedence: defaults -> this file -> IDEAPRESS_* environment variables -> CLI flags.

[server]
host = "127.0.0.1"
port = 8767
allow_lan_exposure = false
allowed_hosts = []          # required when host is not loopback (ADR-0026)

[storage]
# database_url and project_dir default under the XDG data directory.
auto_migrate = true

[inference]
mode = "ollama"             # ollama | loadcoach | openai_compatible
fallback_mode = ""          # optional; empty means no fallback
pin_backend = false         # true = never fall back, fail the stage instead
# The classification of the work this installation sends to a model: public | internal |
# confidential. One value for every request — the true statement is about the installation, not
# about a stage. LoadCoach records max(caller, adapter) (ADR-0065 rule 2); the default is the
# lowest level, which joins to the adapter's own value.
data_classification = "public"

[inference.ollama]
base_url = "http://127.0.0.1:11434"
timeout_seconds = 300

[execution]
# One generation in flight, and one model resident, at a time (ADR-0038). A value above 1 is
# refused at startup: IdeaPress has no queue and two models do not fit on a single-GPU machine.
max_concurrent_stages = 1
unload_before_model_switch = true

# Standalone stage -> model bindings. One key per model-using stage in workflows §2, spelled
# exactly as the stage is; a binding for a stage that does not exist, or a model-using stage with
# no binding, fails startup validation naming the stage.
[models.stages]
requirements       = "ollama/qwen3.5:9b-q8_0"
research_synthesis = "ollama/qwen3.5:9b-q8_0"
outline            = "ollama/qwen3.5:9b-q8_0"
draft              = "ollama/gemma4:12b"
repair             = "ollama/qwen3.5:9b-q8_0"
audit_fast         = "ollama/qwen3.5:9b-q8_0"
audit_deep         = "ollama/qwen3.5:9b-q8_0"
fact_check         = "ollama/qwen3.5:9b-q8_0"
critique           = "ollama/qwen3.5:9b-q8_0"
revise             = "ollama/qwen3.5:9b-q8_0"
project_review     = "ollama/qwen3.5:9b-q8_0"

# Per-stage LoRA adapter pins, sent to LoadCoach as its `adapter` override. Sparse: a stage with
# no key has no pin, and a key present is a pin in effect — there is no second boolean (ADR-0083).
# Only in `loadcoach` mode; a pin in any other mode is refused at startup. Values are LoadCoach's
# manifest names. A pin that cannot be honoured fails its stage; it is never served by the bare
# base.
# [models.stage_adapters]
# draft  = "house-voice"
# revise = "terse-editor"

[workflow]
max_revision_rounds = 3
diminishing_returns_threshold = 0.05
max_attempts_per_stage = 3
audit_escalation_threshold = 0.6
require_clean_validation_to_commit = true
# Whether an audit's explicit attestation may satisfy a blocking requirement that has no
# deterministic check (ADR-0039). Silence never satisfies one either way; false forces a wholly
# mechanical gate, pausing such units instead.
allow_audit_gated_requirements = true
# Output-token budget for the structured stages (requirements, outline, audits, critique,
# project review); raised above 8192 it also lifts the thinking floor of the text-writing
# stages (draft, repair, revise). A reasoning model spends output tokens thinking before its
# first word of answer; a unit paused for an exhausted output budget needs this raised.
# Accepted range: 1024-131072.
structured_output_tokens = 8192

# The `research` stage (workflows §2 row 2, ADR-0116). Every default is closed: with no host named
# `http_fetch` is not registered at all, so a fresh install fetches nothing. `allowed_tools` is the
# executor's allowlist, not its registry — a shipped tool omitted here is refused as a recorded
# result. Notes come from URLs written verbatim in the brief and from files an operator drops in
# `<project directory>/sources/`, which is the only path a tool call ever reads.
[research]
allowed_tools = ["http_fetch", "read_file"]
allowed_hosts = []          # e.g. ["docs.example.com"]; empty means no fetch tool at all
max_fetch_bytes = 1048576
max_file_bytes = 1048576
timeout_seconds = 30.0
# The most sensitive data a *remote* fetch target may receive. Unset denies every remote host
# (fail closed, ADR-0103 decision 2); a loopback host carries no ceiling and is approved.
# max_data_classification = "public"

[providers]
allow_remote = false        # a remote backend sends your drafts off this machine

# Where a `baseaicore.ModelPricing` catalogue (ADR-0072) is read from, for the workspace's cost
# figures. Optional: with no file, every attempt is honestly unpriced ('—', never '$0.00').
# [pricing]
# file = "/path/to/prices.json"

# LoadLedger ceilings (row J1). Every ceiling is optional and independent; naming neither half
# means it does not exist, and the ledger still accumulates and still renders.
# [budget]
# per_output_token_ceiling = 2000000
# per_project_token_ceiling = 20000000
# partial_pricing = "floor"          # floor | strict (ADR-0069)
# [budget.per_output_money_ceiling]
# currency = "USD"
# nanos = 2000000000                  # $2.00
# [budget.per_project_money_ceiling]
# currency = "USD"
# nanos = 20000000000                 # $20.00

[logging]
level = "INFO"
include_content = false     # your prompts and drafts are never logged by default
